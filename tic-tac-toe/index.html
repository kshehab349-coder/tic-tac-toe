<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="status" id="status">
      Player X Turn
    </div>

    <div class="board">

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

    </div>

    <button onclick="restartGame()">Restart Game</button>
  </div>

  <script src="actions.js"></script>
</body>
</html>
